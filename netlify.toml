# 積金羅盤 — Netlify
#
# Netlify sets NETLIFY=true during CI, so the Nitro preset switches to
# `netlify` (SSR + Functions). Local default remains Vercel for the preview.
# No XAI_API_KEY: the public site does not call Grok.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
